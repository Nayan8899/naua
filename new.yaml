apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  namespace: default
  labels:
    app: my-app
spec:
  replicas: 7
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Creates 1 extra pod before killing old ones during an update
      maxUnavailable: 0  # Guarantees all 3 original pods stay alive during an update
  selector:
    matchLabels:
      app: my-app        # Tells the deployment which pods it owns
  template:
    metadata:
      labels:
        app: my-app      # Labels applied to the generated pods
    spec:
      containers:
      - name: application-container
        image: nginx:1.25-alpine # Replace with your image registry link
        imagePullPolicy: IfNotPresent
        
        ports:
        - containerPort: 80
          name: http

        # 🚀 Prevents apps from consuming entire node resources
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"

        # 🩺 Health Checks
        livenessProbe:   # Restarts the pod if it hangs or crashes
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20

        readinessProbe:  # Traffic only hits the pod when this passes
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
