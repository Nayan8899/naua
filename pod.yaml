apiVersion: v1
kind: Pod
metadata:
  name: new
  labels:
    web: app
spec:
  containers:
    - name: nah
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: new
          mountPath: /usr/share/nginx/html
  volumes:
    - name: new
      emptyDir: {}