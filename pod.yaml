apiVersion: apps/v1
kind: Deployment
metadata:
  name: anay
  namespace: nayan
  labels:
    app: webapp
spec:
  replicas: 7
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: nau
          image: httpd
          ports:
            - containerPort: 80
