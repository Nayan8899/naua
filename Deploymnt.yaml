apiVersion: v1
kind: Pod
metadata:
  name: hu
  namespace: nayan
  labels:
    app: nginx-app       # Unique app label
    service: multi-app   # Shared service label <-- ADD THIS
spec:
  containers:
    - name: hu-containers
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: pu-x
  namespace: nayan
  labels:
    app: firefox-app     # Unique app label
    service: multi-app   # Shared service label <-- ADD THIS
spec:
  containers:
    - name: firefox
      image: jlesage/firefox
      ports:
        - containerPort: 5800
